{% extends 'logs_app/base.html' %}

{% block page_header %}

<h1>Topics</h1>

{% endblock page_header %}


{% block content %}
<p>Topics</p>
<ul>
    {% for topic in topics %}
        <li><h4>
            <a  href="{% url 'logs_app:topic' topic.id %}">{{topic}}</a>
        </h4></li>
    {%empty%}
        <li><h3>no topics added yet</h3></li>>
    {%endfor%}

</ul>

<h6><a href="{% url  'logs_app:newTopic' %}">Add new topic</a></h6> 




{% endblock content %}
