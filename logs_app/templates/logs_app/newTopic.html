{% extends 'logs_app/base.html' %}
{% load django_bootstrap5 %}

{% block page_header %}

<h4>Add A New Topic</h4>

{% endblock page_header %}

{% block content %}

    <form action="{% url 'logs_app:newTopic' %}" method="POST" class="form">
        {% csrf_token %}
        {% bootstrap_form form %}
        <button class="btn btn-primary btn-sm" name="submit">Add Topic</button>
    </form>

{% endblock content %}
