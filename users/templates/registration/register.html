{% extends 'logs_app/base.html' %}
{% load django_bootstrap5 %}
{% block page_header %}
    <h4 class="bg-info">Join Us</h4>
{% endblock page_header %}

{% block content %} 

<form action="{% url 'users:register' %}" method="POST" class="form">
    {% csrf_token %}
    {% bootstrap_form form %}
    <button name="submit" class="btn btn btn-primary">Register</button>
    <input type="hidden" name="next" value="{% url 'logs_app:index' %}" />
</form>

{% endblock content %}
